name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION"
        shell: bash

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Create source tarball
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          git archive --format=tar.gz -o cloudpass-$VERSION-source.tar.gz HEAD

      - name: List build artifacts
        run: |
          ls -la cloudpass-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CloudPass v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            cloudpass-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz
            cloudpass-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
            cloudpass-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz
            cloudpass-${{ steps.version.outputs.VERSION }}-darwin-amd64.tar.gz
            cloudpass-${{ steps.version.outputs.VERSION }}-windows-amd64.zip
            cloudpass-${{ steps.version.outputs.VERSION }}-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
