apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpass-api
  labels:
    app: cloudpass
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudpass
      component: api
  template:
    metadata:
      labels:
        app: cloudpass
        component: api
    spec:
      containers:
        - name: api
          image: cloudpass/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CLOUDPASS_CONFIG
              value: /config/config.yaml
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: cloudpass-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpass-ui
  labels:
    app: cloudpass
    component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudpass
      component: ui
  template:
    metadata:
      labels:
        app: cloudpass
        component: ui
    spec:
      containers:
        - name: ui
          image: cloudpass/ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
