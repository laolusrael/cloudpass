apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudpass-ingress
  labels:
    app: cloudpass
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: cloudpass.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudpass-ui
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloudpass-api
                port:
                  number: 8080
